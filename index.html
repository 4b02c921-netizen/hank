<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AAC 聲母溝通系統 </title>
<style>
:root {
  --bg: #F5F4F0;
  --surface: #FFFFFF;
  --surface2: #EEEDE9;
  --border: rgba(0,0,0,0.10);
  --border-strong: rgba(0,0,0,0.18);
  --text: #1A1917;
  --text2: #5C5B57;
  --accent: #185FA5;
  --accent-bg: #E6F1FB;
  --accent-text: #0C447C;
  --danger: #A32D2D;
  --danger-bg: #FCEBEB;
  --radius: 12px;
  --radius-sm: 8px;
  --ai-a: #1755C4;
  --ai-b: #5B3DC8;
  --ai-bg: #EEF2FF;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'PingFang TC', -apple-system, 'Noto Sans TC', sans-serif;
  background: var(--bg); color: var(--text);
  height: 100dvh; display: flex; flex-direction: column;
  overflow: hidden; padding: 8px; gap: 6px;
}

/* ── 頂部提示 ── */
.hint-banner {
  background: #FFF3CD; color: #856404; font-size: 13px;
  font-weight: 600; padding: 6px 10px; border-radius: var(--radius-sm);
  text-align: center; border: 1px solid #FFEEBA; flex-shrink: 0;
}

/* ── 顯示區 ── */
.display-area {
  background: var(--surface);
  border: 0.5px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 8px 12px 6px;
  flex-shrink: 0;
}
.label {
  font-size: 11px; font-weight: 500; color: var(--text2);
  letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 3px;
}
#sentence-box {
  font-size: 23px; font-weight: 600; color: var(--text);
  line-height: 1.35; min-height: 34px; word-break: break-all;
}
#sentence-box.placeholder { color: var(--text2); font-weight: 400; }
.buffer-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; min-height: 22px; }
#buffer-box { font-size: 15px; font-weight: 600; color: var(--accent); letter-spacing: 4px; font-family: 'Courier New', monospace; }
#buffer-box:empty::after { content: '等待輸入…'; color: var(--border-strong); font-weight: 400; letter-spacing: 0; font-family: inherit; font-size: 12px; }

/* ── 候選列 ── */
.predict-section {
  flex-shrink: 0;
}
/* 候選詞滿版模式 */
.predict-section.fullscreen {
  flex: 1;
  min-height: 0;
  display: flex;
}
.predict-section.fullscreen .predict-bar {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-auto-rows: minmax(64px, 1fr);
  gap: 10px;
  overflow: hidden;
  padding: 8px 4px;
  max-height: none;
}
.predict-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  overflow: hidden;
  padding: 2px 2px 4px;
  min-height: 42px;
  max-height: 92px;
}
.predict-bar::-webkit-scrollbar { display: none; }
.predict-item {
  background: var(--surface);
  border: 0.5px solid var(--border-strong);
  border-radius: 10px;
  padding: 5px 6px;
  font-size: 18px;
  font-weight: 600;
  color: var(--accent-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  user-select: none;
  transition: background 0.1s, transform 0.1s;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 38px;
  line-height: 1.1;
}
.predict-item:active { background: var(--accent-bg); transform: scale(0.96); }
.predict-item.context { background: var(--accent-bg); border-color: rgba(24,95,165,0.25); }
.predict-item.ai { background: linear-gradient(135deg, var(--ai-a) 0%, var(--ai-b) 100%); border-color: transparent; color: #fff; font-weight: 600; box-shadow: 0 2px 8px rgba(23,85,196,0.25); }
.predict-item.ai:active { opacity: 0.82; transform: scale(0.96); }
.predict-sep { flex-shrink: 0; width: 1px; height: 26px; background: var(--border-strong); margin: 0 2px; opacity: 0.4; }
.predict-loader { display: flex; align-items: center; gap: 6px; padding: 6px 10px; font-size: 13px; color: var(--ai-a); white-space: nowrap; flex-shrink: 0; }
.dot-pulse { display: flex; gap: 3px; align-items: center; }
.dot-pulse span { width: 5px; height: 5px; border-radius: 50%; background: var(--ai-a); animation: dp 1.3s ease-in-out infinite; }
.dot-pulse span:nth-child(2) { animation-delay: .18s; }
.dot-pulse span:nth-child(3) { animation-delay: .36s; }
@keyframes dp { 0%,80%,100% { transform: scale(.5); opacity: .3; } 40% { transform: scale(1); opacity: 1; } }
.predict-empty { font-size: 13px; color: var(--text2); padding: 8px 4px; }

/* ── 輸入模式切換 ── */
.mode-row {
  display: grid;
  grid-template-columns: repeat(3, 160px);
  gap: 8px;
  flex-shrink: 0;
  justify-content: center;
}

.mode-tab {
  height: 34px;
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text2);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.mode-tab.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

/* ── 鍵盤 ── */
.keyboard-wrap { flex-shrink: 0; }
.keyboard { display: grid; grid-template-columns: repeat(6,1fr); gap: 5px; }
.key {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: clamp(17px, 2.4vh, 20px);
  font-weight: 600;
  color: var(--text);
  height: clamp(34px, 5.2vh, 44px);
  cursor: pointer;
  user-select: none;
  transition: background .08s, transform .08s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.key:active { background: var(--surface2); transform: scale(.94); }
.key.fn { background: var(--surface2); font-size: 13px; font-weight: 500; color: var(--text2); }
.key.mode { background: #3C3489; color: #EEEDFE; font-size: 13px; font-weight: 600; }
.key.del { background: var(--danger-bg); color: var(--danger); font-size: 17px; }

/* ── 操作列 ── */
.action-row {
  display: grid;
  grid-template-columns: 48px 48px 150px 180px;
  gap: 8px;
  flex-shrink: 0;
  justify-content: center;
}
.btn {
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  user-select: none;
  font-family: inherit;
  font-weight: 600;
  transition: opacity .1s, transform .1s;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 40px;
}
.btn:active { opacity: .8; transform: scale(.97); }
.btn-mic  { background: var(--surface2); color: var(--text2); font-size: 22px; }
.btn-cfg  { background: var(--ai-bg); color: var(--ai-a); font-size: 17px; border: 0.5px solid rgba(23,85,196,0.2); }
.btn-clear{ background: var(--surface2); color: var(--danger); font-size: 13px; border: 0.5px solid rgba(163,45,45,0.2); }
.btn-send { background: var(--accent); color: #fff; font-size: 13px; }

/* ── 歷史 ── */
.history-wrap {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 10px;
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 40px;
}
.history-scroll { overflow-y: auto; flex: 1; scrollbar-width: thin; }
.history-item { padding: 5px 0; border-bottom: 0.5px solid var(--border); font-size: 14px; color: var(--text2); display: flex; gap: 8px; }
.history-item:last-child { border-bottom: none; }
.history-time { font-size: 11px; color: var(--border-strong); white-space: nowrap; flex-shrink: 0; margin-top: 2px; }
.history-text { color: var(--text); font-size: 14px; }
.history-empty { font-size: 13px; color: var(--border-strong); text-align: center; padding: 8px 0; }

@media (max-width: 700px) {
  .mode-row {
    grid-template-columns: repeat(3, 1fr);
  }

  .action-row {
    grid-template-columns: 42px 42px 1fr 1fr;
  }

  .btn {
    height: 40px;
  }
}

</style>
</head>

<div class="hint-banner">💡 操作提示：請輸入每字的「最前面注音」（例如：早安 👉 點選 ㄗ 和 ㄢ）</div>

<div class="history-wrap">

// ════════════════════════════════════════
// 高速比對引擎 (取代舊版 DFS)
// ════════════════════════════════════════
function getPrefixMatches(buf) {
  if (!buf) return [];

  const results = new Set();

  // 1. 精準前綴搜尋
  parsedDict.forEach(item => {
    if (item.init.startsWith(buf)) {
      results.add(item.word);
    }
  });

  // 2. 寬容搜尋：如果完全找不到，就退回「第一個注音」
  // 例如輸入 ㄅㄚ 找不到，就改找所有 ㄅ 開頭的詞
  if (results.size === 0 && buf.length >= 2) {
    const firstSymbol = buf.slice(0, 1);
    parsedDict.forEach(item => {
      if (item.init.startsWith(firstSymbol)) {
        results.add(item.word);
      }
    });
  }

  // 3. 還是找不到時，給常用保底詞，不再顯示空白
  if (results.size === 0) {
    ["謝謝", "好的", "不要", "我想喝水", "我想休息", "上廁所", "緊急", "叫醫生"].forEach(word => {
      results.add(word);
    });
  }

  return Array.from(results).slice(0, 12);
}

function getContextSuggestions() {
  if (!sentence) return wordFlow.DEFAULT;

  // 優先依照上一個點選的詞推薦
  if (lastSelectedWord && wordFlow[lastSelectedWord]) {
    return wordFlow[lastSelectedWord];
  }

  // 如果沒有上一個詞，就用句子最後幾個字判斷
  return wordFlow[sentence.slice(-4)] ||
         wordFlow[sentence.slice(-3)] ||
         wordFlow[sentence.slice(-2)] ||
         wordFlow[sentence.slice(-1)] ||
         wordFlow.DEFAULT;
}

  inputMode = mode;

  document.getElementById('mode-keyboard').classList.toggle('active', mode === 'keyboard');
  document.getElementById('mode-voice').classList.toggle('active', mode === 'voice');
  document.getElementById('mode-ninegrid').classList.toggle('active', mode === 'nineGrid');

  inputBuffer = "";

  if (mode === 'voice') {
    renderVoicePanel();
  } else if (mode === 'nineGrid') {
    renderNineGrid();
  } else {
    renderKeyboard();
  }

  updateUI();
}

    kb.appendChild(btn);
  });

  const backBtn = document.createElement('button');
  backBtn.className = 'key fn';
  backBtn.style.gridColumn = 'span 6';
  backBtn.textContent = '← 回九宮格分類';
  backBtn.onclick = renderNineGrid;
  kb.appendChild(backBtn);
}

function renderPredictBar() {
  const bar = document.getElementById('predict-bar');
  bar.innerHTML = '';
  
  let items = [];
  let isContext = false;
  
  if (inputBuffer) {
    items = getPrefixMatches(inputBuffer);
  } else {
    items = getContextSuggestions();
    isContext = true;
  }

  if (items.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'predict-empty';
    empty.textContent = inputBuffer.length > 2 ? '找不到詞彙，請確認是否只輸入聲母' : '無候選詞';
    bar.appendChild(empty);
    return;
  }

  items.forEach(word => {
    const el = document.createElement('div');
    el.className = 'predict-item' + (isContext ? ' context' : '');
    el.textContent = word;
    el.onclick = () => selectWord(word);
    bar.appendChild(el);
  });
}

function selectWord(word) {
  let final = word;

  if (word === "現在幾點") { 
    const n = new Date(); 
    final = `現在${n.getHours()}點${String(n.getMinutes()).padStart(2,'0')}分`; 
  } else if (word === "緊急") {
    final = "緊急！";
  }

  sentence += final;
  lastSelectedWord = word;
  inputBuffer = "";
  updateUI();
}

function updateUI() {
  const sb = document.getElementById('sentence-box');
  const predictSection = document.getElementById('predict-section');
  const keyboardWrap = document.querySelector('.keyboard-wrap');
  const historyWrap = document.querySelector('.history-wrap');

  sb.textContent = sentence || "請開始輸入";
  sb.className = sentence ? '' : 'placeholder';
  document.getElementById('buffer-box').textContent = inputBuffer;

  if (inputBuffer) {
    predictSection.classList.add('fullscreen');
    if (keyboardWrap) keyboardWrap.style.display = 'none';
    if (historyWrap) historyWrap.style.display = 'none';
  } else {
    predictSection.classList.remove('fullscreen');
    if (keyboardWrap) keyboardWrap.style.display = '';
    if (historyWrap) historyWrap.style.display = '';
  }

  renderPredictBar();
}

function renderKeyboard() {
  const kb = document.getElementById('keyboard'); 
  kb.innerHTML = "";
  
  const bpmfKeys = ["ㄅ","ㄆ","ㄇ","ㄈ","ㄉ","ㄊ","ㄋ","ㄌ","ㄍ","ㄎ","ㄏ","ㄐ","ㄑ","ㄒ","ㄓ","ㄔ","ㄕ","ㄖ","ㄗ","ㄘ","ㄙ","ㄧ","ㄨ","ㄩ","ㄚ","ㄛ","ㄜ","ㄝ","ㄞ","ㄟ","ㄠ","ㄡ","ㄢ","ㄣ","ㄤ","ㄥ","ㄦ"];
  const numKeys = ["1","2","3","4","5","6","7","8","9","0",".","，"];
  
  (isNumMode ? numKeys : bpmfKeys).forEach(k => {
    const b = document.createElement('button');
    b.className = 'key'; b.textContent = k;
    b.onclick = () => { isNumMode ? sentence += k : inputBuffer += k; updateUI(); };
    kb.appendChild(b);
  });

  const btnMode = document.createElement('button');
  btnMode.className = 'key mode'; btnMode.textContent = isNumMode ? "注音" : "數字";
  btnMode.onclick = () => { isNumMode = !isNumMode; renderKeyboard(); };
  kb.appendChild(btnMode);

  const btnDel = document.createElement('button');
  btnDel.className = 'key del'; btnDel.textContent = "⌫";
  btnDel.onclick = () => { 
    if (inputBuffer) inputBuffer = inputBuffer.slice(0, -1); 
    else if (sentence) sentence = sentence.slice(0, -1); 
    updateUI(); 
  };
  kb.appendChild(btnDel);

  const btnSpace = document.createElement('button');
  btnSpace.className = 'key fn'; btnSpace.textContent = "空格";
  btnSpace.onclick = () => { if (!isNumMode) sentence += " "; updateUI(); };
  kb.appendChild(btnSpace);
}

function sendAndClear() {
  if (!sentence) return;
  try {
    const hist = JSON.parse(localStorage.getItem('aac_hist') || '[]');
    hist.unshift({ t: new Date().toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' }), s: sentence });
    localStorage.setItem('aac_hist', JSON.stringify(hist.slice(0, 20)));
  } catch(e) {}
  sentence = "";
inputBuffer = "";
lastSelectedWord = "";
updateUI();
renderHistory();
}

function clearAll() {
  sentence = "";
  inputBuffer = "";
  lastSelectedWord = "";
  updateUI();
}


function renderHistory() {
  let hist = []; try { hist = JSON.parse(localStorage.getItem('aac_hist') || '[]'); } catch {}
  const box = document.getElementById('history-box');
  if (!hist.length) { box.innerHTML = '<div class="history-empty">尚無紀錄</div>'; return; }
  box.innerHTML = hist.slice(0, 10).map(h => `<div class="history-item"><span class="history-time">${h.t}</span><span class="history-text">${h.s}</span></div>`).join('');
}

function toggleVoice() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    alert('此瀏覽器不支援語音輸入，請使用 Chrome。');
    return;
  }

  const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.lang = 'zh-TW';
  rec.interimResults = false;

  const btn = document.getElementById('mic-btn');
  if (btn) btn.textContent = '⏳';

  rec.start();

  rec.onresult = e => {
    sentence += e.results[0][0].transcript;
    inputBuffer = "";
    lastSelectedWord = "";
    updateUI();
  };

  rec.onend = rec.onerror = () => {
    if (btn) btn.textContent = '🎙';
  };
}

setInputMode("keyboard");
renderHistory();
updateUI();

</script>
</body>
</html>
